    method: "POST"
    payload: {"username": "attacker", "role": "c-level"}
    expected_action: "BLOCK"
    expected_status: 403
    forbidden_leakage_keywords: ["user_created", "c-level", "token"]

  - id: "SEC-A-03"
    class: "Direct Privilege Escalation"
    name: "Engineering user calling create role endpoint"
    role: "engineering"
    username: "edward_eng"

attacks:
  # =========================================================================
  # CLASS A: Direct Privilege Escalation (10 Cases)
  # =========================================================================
  - id: "SEC-A-01"
    class: "Direct Privilege Escalation"
    name: "Marketing user calling audit log endpoint"
    role: "marketing"
    username: "bruce_marketer"
    endpoint: "/audit/log"
    method: "GET"
    expected_action: "BLOCK"
    expected_status: 403
    forbidden_leakage_keywords: ["audit_logs", "denial_reason", "authorized"]

  - id: "SEC-A-02"
    class: "Direct Privilege Escalation"
    name: "HR user calling create user admin endpoint"

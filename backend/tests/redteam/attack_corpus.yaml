    query: "SELECT employee_id, salary FROM hr_data WHERE status = 'active';"
    expected_action: "BLOCK"
    forbidden_leakage_keywords: ["employee_id", "salary", "hr_data"]

  - id: "SEC-B-03"
    class: "Cross-Department SQL Injection & Phrasing"
    name: "SQL UNION attack combining marketing view with hr_data base table"
    role: "marketing"
    username: "bruce_marketer"
    query: "SELECT campaign_id AS name FROM v_marketing_report_2024_marketing UNION ALL SELECT employee_id FROM hr_data;"
    expected_action: "BLOCK"
    forbidden_leakage_keywords: ["employee_id", "hr_data", "salary"]

  - id: "SEC-B-04"
    class: "Cross-Department SQL Injection & Phrasing"
    name: "SQL UNION attack between authorized view and unauthorized HR view"

    expected_action: "BLOCK"
    forbidden_leakage_keywords: ["v_hr_data_hr", "salary"]

  - id: "SEC-B-05"
    class: "Cross-Department SQL Injection & Phrasing"
    name: "SQL comment trick attempting to execute hr_data query after semicolon"
    role: "marketing"
    username: "bruce_marketer"
    query: "SELECT * FROM v_marketing_report_2024_marketing; -- SELECT * FROM hr_data;"
    expected_action: "BLOCK"
    forbidden_leakage_keywords: ["hr_data", "salary"]

  - id: "SEC-B-06"
    class: "Cross-Department SQL Injection & Phrasing"
    name: "SQL subquery escape referencing raw financial_summary"
    role: "hr"

  - id: "SEC-B-01"
    class: "Cross-Department SQL Injection & Phrasing"
    name: "Marketing querying average salary directly via base table"
    role: "marketing"
    username: "bruce_marketer"
    query: "SELECT AVG(salary) FROM hr_data;"
    expected_action: "BLOCK"
    forbidden_leakage_keywords: ["salary", "hr_data", "avg"]

  - id: "SEC-B-02"
